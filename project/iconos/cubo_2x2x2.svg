<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="280" viewBox="0 0 256 280">

  <!-- Cara reutilizable con cuatro pegatinas y separaciones oscuras -->
  <defs>
    <g id="cara">
      <rect width="100" height="100" rx="3" fill="#202020"/>

      <g fill="currentColor">
        <rect x="5" y="5" width="42" height="42" rx="4"/>
        <rect x="53" y="5" width="42" height="42" rx="4"/>
        <rect x="5" y="53" width="42" height="42" rx="4"/>
        <rect x="53" y="53" width="42" height="42" rx="4"/>
      </g>
    </g>
  </defs>

  <!-- Cara superior azul -->
  <use href="#cara"
       color="#009fff"
       transform="matrix(1.04 -0.60 1.04 0.60 24 80)"/>

  <!-- Cara frontal blanca -->
  <use href="#cara"
       color="#fafafa"
       transform="matrix(1.04 0.60 0 1.20 24 80)"/>

  <!-- Cara lateral derecha roja -->
  <use href="#cara"
       color="#d65353"
       transform="matrix(1.04 -0.60 0 1.20 128 140)"/>
</svg>