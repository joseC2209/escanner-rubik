# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is automatically triggered for every push and pull request, to verify that everything still builds.

name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Instalar dependencias de Windows
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-opencv

      - name: Compilar la extensión de Windows
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrt64 = Join-Path $env:MSYS2_LOCATION 'ucrt64'
          $env:Path = "$(Join-Path $ucrt64 'bin');$env:Path"

          cmake -S . -B build-ci -G "MinGW Makefiles" `
            "-DCMAKE_BUILD_TYPE=Debug" `
            "-DGODOTCPP_TARGET=template_debug" `
            "-DUCRT64_ROOT=$ucrt64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build build-ci --target rubik_scanner --parallel 2
          exit $LASTEXITCODE

      - name: Descargar Godot 4.7.2
        shell: pwsh
        run: |
          $archivo = 'Godot_v4.7.2-stable_win64.exe.zip'
          $zip = Join-Path $env:RUNNER_TEMP $archivo
          $destino = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'

          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archivo" `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destino

          $godot = Get-ChildItem -LiteralPath $destino -Recurse -File `
            -Filter '*_console.exe' | Select-Object -First 1
          if (-not $godot) { throw 'No se encontró el ejecutable de consola de Godot' }

          "GODOT_EXE=$($godot.FullName)" >> $env:GITHUB_ENV

      - name: Ejecutar las pruebas del solucionador
        shell: pwsh
        run: |
          $proyecto = Join-Path $env:GITHUB_WORKSPACE 'project'
          $dlls = Join-Path $proyecto 'bin/windows'
          $env:Path = "$dlls;$env:Path"

          & $env:GODOT_EXE --headless --path $proyecto --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $env:GODOT_EXE --headless --path $proyecto `
            --script 'res://tests/test_rubik_solver.gd'
          exit $LASTEXITCODE